[project]
name = "mindstores-backend"
version = "3.0.0"
description = "Mindstores backend ported to Python FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "dnspython==2.8.0",
  "pymongo==4.17.0",
  "python-dotenv==1.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "uvicorn[standard]==0.34.2",
]
