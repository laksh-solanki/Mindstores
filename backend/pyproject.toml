[project]
name = "mindstores-backend"
version = "3.0.0"
description = "Mindstores backend ported to Python FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.10.1",
  "python-dotenv==1.2.2",
  "pymongo[srv]==4.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
