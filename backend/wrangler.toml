name = "mindstores-backend"
main = "worker.js"
compatibility_date = "2026-04-29"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
CORS_ORIGINS = "http://localhost:3000,http://localhost:5173,https://mindstores.vercel.app,https://mindstores.onrender.com"

# Environment variables
[env.production]
vars = { ENVIRONMENT = "production", CORS_ORIGINS = "https://mindstores.vercel.app,https://mindstores.onrender.com" }

[env.staging]
vars = { ENVIRONMENT = "staging", CORS_ORIGINS = "http://localhost:3000,http://localhost:5173" }
